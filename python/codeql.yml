name: CodeQL Security Scan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'edfi-repo-auditor/**/*'
  push:
    branches:
      - main

permissions:
  security-events: write
  actions: read
  attestations: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edfi-repo-auditor/
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9.x"
          cache: "poetry"

      - name: Install dependencies
        run: poetry env use "3.9" && poetry install

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: "python"
          setup-python-dependencies: false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:python"
