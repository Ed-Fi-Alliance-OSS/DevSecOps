name: Build and Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
  push:
    branches:
      - main
    paths:
      - 'src/**'

permissions: read-all

env:
  DB_PASS: temporaryDbP@ssw0rd!

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    # Only use when integration / end-to-end tests need SQL Server
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          SA_PASSWORD: ${{ env.DB_PASS }}
          ACCEPT_EULA: 'Y'
        ports:
          - 1433:1433

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 6.0.x

    - name: Build
      run: dotnet build
      shell: pwsh

    - name: Run unit tests
      run: dotnet test
      shell: pwsh

    - name: Upload code analysis results for Project X
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        # Path to SARIF file relative to the root of the repository
        sarif_file: directory/results.sarif
        # Optional category for the results
        # Used to differentiate multiple results for one commit
        category: EdFi.ProjectX

    - name: Upload Unit test results
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      if: success() || failure()
      with:
        name: .NET Tests
        path: "**/test-results.trx"    # Path to test results
        reporter: dotnet-trx
