name: CodeQL Security Scan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Meadowlark-js/**'
  push:
    branches:
      - main

permissions: read-all

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    env:
        SRC_DIR: Meadowlark-js
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: NPM caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
            node-version: '16'
            cache: 'yarn'
            cache-dependency-path: '**/yarn.lock'

      - name: Install dependencies
        run: yarn install
        working-directory: Meadowlark-js

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: "typescript"
          setup-python-dependencies: false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
